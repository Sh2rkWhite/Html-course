<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомні радіокнопки</title>

    <link rel="stylesheet" href="dz5.css">
</head>
<body>
    <div class="radio-group">
        
       
        <label class="radio-container">
            <input type="radio" name="plan" value="basic" class="radio-input" checked>
            <div class="radio-label">
                <div class="radio-custom"></div>
                <div class="radio-content">
                    <span class="radio-title">Базовий тариф</span>
                    <span class="radio-description">Доступ до основних функцій</span>
                </div>
            </div>
        </label>

    
        <label class="radio-container">
            <input type="radio" name="plan" value="pro" class="radio-input">
            <div class="radio-label">
                <div class="radio-custom"></div>
                <div class="radio-content">
                    <span class="radio-title">Pro тариф</span>
                    <span class="radio-description">Розширені можливості та підтримка</span>
                </div>
            </div>
        </label>

        
        <label class="radio-container">
            <input type="radio" name="plan" value="premium" class="radio-input">
            <div class="radio-label">
                <div class="radio-custom"></div>
                <div class="radio-content">
                    <span class="radio-title">Преміум тариф</span>
                    <span class="radio-description">Усі функції без обмежень</span>
                </div>
            </div>
        </label>

    </div>
</body>
</html>
